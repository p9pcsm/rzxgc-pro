<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>认知小观察 · 专业版（3岁-成人）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(160deg,#F4F7FE,#EAF3EC);min-height:100vh;color:#2b2f36;user-select:none}
.wrap{max-width:660px;margin:0 auto;padding:20px 18px 44px}
.card{background:#fff;border-radius:22px;padding:28px 24px;box-shadow:0 6px 24px rgba(30,60,120,.09);margin-top:18px}
h1{font-size:29px;text-align:center;color:#1F5FA8}
.sub{text-align:center;color:#7a8494;font-size:15px;margin-top:8px;line-height:1.8}
.badge{display:inline-block;background:#EAF1FD;color:#1F5FA8;font-size:13px;padding:4px 12px;border-radius:20px;margin:4px 2px}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:16px;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3E8EDE,#1F5FA8);margin-top:18px;cursor:pointer;box-shadow:0 4px 14px rgba(31,95,168,.30)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#F1F5F9;color:#555;box-shadow:none}
.agebtn{display:flex;align-items:center;width:100%;background:#F7FAFF;border:2.5px solid #DCE9FF;border-radius:16px;padding:15px 18px;margin-top:12px;cursor:pointer;text-align:left}
.agebtn:active{transform:scale(.98);background:#EAF3FF}
.agebtn .em{font-size:34px;margin-right:14px}
.agebtn .t1{font-size:19px;font-weight:700;color:#2b2f36}
.agebtn .t2{font-size:13.5px;color:#7a8494;margin-top:3px}
.opt{display:block;width:100%;text-align:left;background:#F7FAFF;border:2.5px solid #DCE9FF;border-radius:16px;padding:15px 18px;font-size:22px;margin-top:12px;cursor:pointer;color:#2b2f36}
.opt:active{transform:scale(.98);background:#EAF3FF}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.optgrid .opt{text-align:center;font-size:40px;padding:18px 8px}
.q{font-size:24px;font-weight:700;line-height:1.65;margin:6px 0 4px}
.qsmall{font-size:16px;color:#7a8494;margin-top:6px;line-height:1.6}
.prog{height:10px;background:#EDF1F6;border-radius:6px;overflow:hidden;margin-top:14px}
.prog>div{height:100%;background:linear-gradient(90deg,#3E8EDE,#1F5FA8);border-radius:6px;transition:width .3s}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#7a8494}
.pausebtn{background:#F1F5F9;border:none;border-radius:12px;padding:8px 14px;font-size:15px;color:#666;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
#overlay .card{margin:0 24px;text-align:center}
.memshow{font-size:62px;font-weight:800;text-align:center;padding:44px 0;letter-spacing:6px;color:#1F5FA8;min-height:168px}
.memhint{text-align:center;color:#7a8494;font-size:17px}
.feedback{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:60px;z-index:60;display:none;pointer-events:none}
.bar{margin-top:14px}
.bar .blabel{display:flex;justify-content:space-between;font-size:16px;margin-bottom:6px}
.bartrack{height:16px;background:#F0F2F5;border-radius:9px;overflow:hidden}
.barfill{height:100%;border-radius:9px}
.warn{background:#FFF8E6;border:1.5px dashed #E8A93D;border-radius:14px;padding:14px 16px;font-size:14.5px;color:#8A5B00;line-height:1.8;margin-top:16px}
.domainchip{display:inline-block;font-size:14px;font-weight:700;padding:5px 14px;border-radius:20px;color:#fff;margin-bottom:8px}
.hide{display:none!important}
.targetbox{text-align:center;font-size:20px;margin:10px 0}
.targetbox .t{font-size:64px}
.summary{font-size:16.5px;line-height:2;background:#F4F8FE;border-radius:14px;padding:16px;margin-top:14px}
.bandtag{text-align:center;margin-top:6px}
.bandtag span{display:inline-block;background:#EAF1FD;color:#1F5FA8;font-size:14px;font-weight:700;padding:5px 16px;border-radius:20px}
</style>
</head>
<body>
<div class="wrap">

<!-- 开始页 -->
<div id="s-start" class="card">
<h1>🔍 认知小观察 · 专业版</h1>
<p class="sub">3岁 — 成人，全年龄段覆盖<br>先选年龄，再进对应题库</p>
<div style="text-align:center;margin-top:10px">
<span class="badge">🗣️ 语言理解</span><span class="badge">🧭 视觉空间</span><span class="badge">🧩 流体推理</span><span class="badge">🧠 工作记忆</span><span class="badge">⚡ 加工速度</span><span class="badge">👁️ 注意力</span><span class="badge">🎛️ 执行功能</span>
</div>
<div class="warn">⚠️ 这是<strong>原创的趣味筛查工具</strong>，题目按年龄段分级但<strong>未经标准化</strong>，不出 IQ 分数，不能作为诊断依据。正式评估请前往医院心理科等正规机构。</div>
<button class="btn" onclick="show('s-age')">选择年龄 ▶</button>
</div>

<!-- 年龄选择页 -->
<div id="s-age" class="card hide">
<h1 style="font-size:24px">请选择年龄段</h1>
<p class="sub">将进入该年龄段的专属题库</p>
<div id="age-list" style="margin-top:8px"></div>
<button class="btn ghost" onclick="show('s-start')">← 返回</button>
</div>

<!-- 维度介绍页 -->
<div id="s-domain" class="card hide">
<div class="bandtag"><span id="d-band"></span></div>
<div style="text-align:center;margin-top:8px"><span id="d-chip" class="domainchip"></span></div>
<h1 id="d-title" style="font-size:25px"></h1>
<p class="sub" id="d-desc"></p>
<p class="sub" id="d-note" style="color:#C26A00;font-weight:700"></p>
<button class="btn" id="d-btn" onclick="beginDomain()">进入本轮 ▶</button>
</div>

<!-- 答题页 -->
<div id="s-quiz" class="card hide">
<div class="topbar"><span id="q-count"></span><button class="pausebtn" onclick="pauseGame()">⏸ 暂停</button></div>
<div class="prog"><div id="q-prog"></div></div>
<div id="q-body" style="margin-top:14px"></div>
</div>

<!-- 结果页 -->
<div id="s-result" class="card hide">
<h1>🎉 挑战完成！</h1>
<div class="bandtag"><span id="r-band"></span></div>
<p class="sub">四个方面的表现画像</p>
<div id="r-bars"></div>
<div class="summary" id="r-summary"></div>
<div class="warn">⚠️ 本结果由原创、未经标准化的题目生成，仅反映本次作答情况，不代表智力水平，不能作为诊断依据。如需正式评估，请前往正规医疗机构心理科。</div>
<button class="btn ghost" onclick="location.reload()">再测一次 🔁</button>
</div>

</div>

<div id="overlay"><div class="card">
<h1 style="font-size:24px">⏸ 已暂停</h1>
<p class="sub">休息一下，不着急</p>
<button class="btn" onclick="resumeGame()">继续 ▶</button>
</div></div>
<div class="feedback" id="fb"></div>

<script>
/* ============ 年龄段 ============ */
const BANDS=[
{label:"3 – 4 岁",em:"🧒",sub:"约10分钟 · 请家长陪同读题",parent:true},
{label:"5 – 6 岁",em:"🧑‍🎒",sub:"约15分钟 · 可独立作答，家长可在旁",parent:true},
{label:"7 – 9 岁",em:"📚",sub:"约20分钟",parent:false},
{label:"10 – 12 岁",em:"💡",sub:"约25分钟",parent:false},
{label:"13 – 17 岁",em:"🎯",sub:"约30分钟",parent:false},
{label:"18 岁以上（成人）",em:"🧑‍💼",sub:"约35分钟",parent:false}];
const DOMAINS=[
{name:"语言理解",color:"#E8862E",desc:"词语、常识和简单推理。"},
{name:"视觉空间",color:"#9B59B6",desc:"旋转、镜像、方位，考考空间感。"},
{name:"流体推理",color:"#7C6FF0",desc:"看图形、数字找规律。"},
{name:"工作记忆",color:"#2B9FD8",desc:"先记住屏幕上出现的内容，再回答。"},
{name:"加工速度",color:"#3DBA6B",desc:"又快又准，每题尽量又快又对。"},
{name:"注意力",color:"#E0506E",desc:"在干扰里找目标，要看仔细、看全。"},
{name:"执行功能",color:"#0E9F8A",desc:"管住冲动、灵活切换规则。"}];
const DEMOJI=["🗣️","🧭","🧩","🧠","⚡","👁️","🎛️"];
/* b:年龄段 0=3-4,1=5-6,2=7-9,3=10-12,4=13-17,5=18+ | d:维度 | a:正确下标 */
const ALL=[
/* ===== b0 3-4岁 · 语言理解 ===== */
{b:0,d:0,t:"choice",q:"哪个小动物会飞？",opts:["🐦","🐟","🐶"],a:0,grid:true},
{b:0,d:0,t:"choice",q:"哪个是红色的？",opts:["🔵","🔴","🟢"],a:1,grid:true},
{b:0,d:0,t:"choice",q:"哪个可以吃？",opts:["🍎","🚗","👕"],a:0,grid:true},
{b:0,d:0,t:"choice",q:"哪个和别的不一样？",opts:["🐱","🐱","🐶"],a:2,grid:true},
{b:0,d:0,t:"choice",q:"晚上挂在天上的是？",opts:["🌞","🌜","☁️"],a:1,grid:true},
{b:0,d:0,t:"choice",q:"哪个动物最大？",opts:["🐘","🐭","🐱"],a:0,grid:true},
/* ===== b0 3-4岁 · 视觉推理 ===== */
{b:0,d:1,t:"choice",q:"🔴&nbsp;🔴&nbsp;🔵&nbsp;🔴&nbsp;🔴&nbsp;❓<br>下一个是什么颜色？",opts:["🔴","🔵","🟢"],a:1,grid:true},
{b:0,d:1,t:"choice",q:"●&nbsp;○&nbsp;●&nbsp;○&nbsp;❓<br>下一个是什么？",opts:["●","○","■"],a:0,grid:true},
{b:0,d:1,t:"choice",q:"1&nbsp;2&nbsp;1&nbsp;2&nbsp;❓<br>下一个数字是？",opts:["1","2","3"],a:0,grid:true},
{b:0,d:1,t:"choice",q:"🍎&nbsp;🍎&nbsp;🍎<br>有几个苹果？",opts:["2个","3个","4个"],a:1},
{b:0,d:1,t:"choice",q:"哪个和 🍎 一样？",opts:["🍐","🍎","🍌"],a:1,grid:true},
{b:0,d:1,t:"choice",q:"⬆&nbsp;⬇&nbsp;⬆&nbsp;⬇&nbsp;❓<br>下一个箭头指向？",opts:["⬆","⬇","⬅"],a:0,grid:true},
/* ===== b0 3-4岁 · 工作记忆 ===== */
{b:0,d:2,t:"mem",seq:["🐱","🐶"],mode:"words",q:"刚才看到了哪两个小动物？",opts:["🐱🐶","🐱🐱","🐶🐰"],a:0},
{b:0,d:2,t:"mem",seq:["🔴","🔵"],mode:"words",q:"先看到的颜色、后看到的颜色是？",opts:["🔴🔵","🔵🔴","🔴🔴"],a:0},
{b:0,d:2,t:"mem",seq:["⭐"],mode:"words",q:"刚才看到了什么？",opts:["⭐","🍎","🚗"],a:0,grid:true},
{b:0,d:2,t:"mem",seq:["🍌","🍇","🍉"],mode:"words",q:"刚才看到的水果，按顺序是？",opts:["🍌🍇🍉","🍌🍉🍇","🍇🍌🍉"],a:0},
{b:0,d:2,t:"mem",seq:["🐘"],mode:"words",q:"刚才看到的是谁？",opts:["🐘","🐭","🐱"],a:0,grid:true},
{b:0,d:2,t:"mem",seq:["🟡","🟢","🔵"],mode:"words",q:"刚才看到的三个颜色，按顺序是？",opts:["🟡🟢🔵","🟢🟡🔵","🟡🔵🟢"],a:0},
/* ===== b0 3-4岁 · 加工速度 ===== */
{b:0,d:3,t:"speed",q:"找到和下面这个一样的：",target:"🍎",opts:["🍎","🍐","🍌"],a:0,grid:true},
{b:0,d:3,t:"speed",q:"找到和下面这个一样的：",target:"🐶",opts:["🐱","🐶","🐰"],a:1,grid:true},
{b:0,d:3,t:"speed",q:"⭐&nbsp;⭐<br>有几个星星？",opts:["1个","2个","3个"],a:1},
{b:0,d:3,t:"speed",q:"找到和下面这个一样的：",target:"🔴",opts:["🔵","🟢","🔴"],a:2,grid:true},
{b:0,d:3,t:"speed",q:"找出不一样的那一个：",opts:["🌞","🌞","🌜"],a:2,grid:true},
{b:0,d:3,t:"speed",q:"找到和下面这个一样的：",target:"⚽",opts:["⚽","🏀","🎾"],a:0,grid:true},
/* ===== b1 5-6岁 · 语言理解 ===== */
{b:1,d:0,t:"choice",q:"下面哪个和其他三个不是一类？",opts:["苹果","香蕉","梨","小狗"],a:3},
{b:1,d:0,t:"choice",q:"下面哪个和其他三个不是一类？",opts:["跑步","游泳","跳绳","桌子"],a:3},
{b:1,d:0,t:"choice",q:"哪个是交通工具？",opts:["汽车","苹果","小狗"],a:0},
{b:1,d:0,t:"choice",q:"小鸟有几条腿？",opts:["2条","4条","6条"],a:0},
{b:1,d:0,t:"choice",q:"一年有几个季节？",opts:["2个","3个","4个"],a:2},
{b:1,d:0,t:"choice",q:"冰受热会变成什么？",opts:["水","石头","沙子"],a:0},
{b:1,d:0,t:"choice",q:"哪个词和其他两个意思不一样？",opts:["高兴","开心","难过"],a:2},
{b:1,d:0,t:"choice",q:"下雨天出门要带什么？",opts:["雨伞","墨镜","扇子"],a:0},
/* ===== b1 5-6岁 · 视觉推理 ===== */
{b:1,d:1,t:"choice",q:"🔴&nbsp;🔵&nbsp;🔴&nbsp;🔵&nbsp;❓<br>下一个是什么？",opts:["🔴","🔵","🟢","🟡"],a:0,grid:true},
{b:1,d:1,t:"choice",q:"▲&nbsp;▲&nbsp;■&nbsp;▲&nbsp;▲&nbsp;❓<br>下一个是什么？",opts:["▲","■","●","★"],a:1,grid:true},
{b:1,d:1,t:"choice",q:"●&nbsp;●&nbsp;○&nbsp;●&nbsp;●&nbsp;○&nbsp;❓<br>下一个是什么？",opts:["●","○","■","▲"],a:0,grid:true},
{b:1,d:1,t:"choice",q:"3&nbsp;2&nbsp;1&nbsp;3&nbsp;2&nbsp;❓<br>下一个数字是？",opts:["1","2","3","4"],a:0,grid:true},
{b:1,d:1,t:"choice",q:"🍎&nbsp;🍎&nbsp;🍎&nbsp;🍎<br>有几个苹果？",opts:["3个","4个","5个","6个"],a:1},
{b:1,d:1,t:"choice",q:"↑&nbsp;→&nbsp;↓&nbsp;❓<br>下一个箭头指向哪？",opts:["←","↑","→","↓"],a:0,grid:true},
{b:1,d:1,t:"choice",q:"◐&nbsp;◑&nbsp;◒&nbsp;❓<br>下一个图形是？",opts:["◓","◐","◑","●"],a:0,grid:true},

{b:1,d:2,t:"mem",seq:["2","7","5"],mode:"forward",q:"刚才的数字，按顺序是？",opts:["2 - 7 - 5","5 - 7 - 2","7 - 2 - 5"],a:0},
{b:1,d:2,t:"mem",seq:["8","1","6","3"],mode:"forward",q:"刚才的数字，按顺序是？",opts:["8 - 1 - 6 - 3","3 - 6 - 1 - 8","1 - 8 - 3 - 6"],a:0},

{b:1,d:2,t:"mem",seq:["猫","狗"],mode:"words",q:"刚才看到了哪两个小动物？",opts:["猫狗","猫鸟","狗鱼"],a:0},

/* ============ 游戏逻辑 ============ */
let order=[],pos=0,answers=[],curDomain=-1,curBand=0,memTimers=[],t0=0,locked=false;

function show(id){["s-start","s-age","s-domain","s-quiz","s-result"].forEach(s=>document.getElementById(s).classList.add("hide"));document.getElementById(id).classList.remove("hide");window.scrollTo(0,0);}

/* 年龄选择列表 */
(function(){
  let html="";
  BANDS.forEach((b,i)=>{
    const n=ALL.filter(it=>it.b===i).length;
    html+='<button class="agebtn" onclick="startTest('+i+')"><span class="em">'+b.em+'</span><span><span class="t1">'+b.label+'</span><div class="t2">'+n+' 题 · '+b.sub+'</div></span></button>';
  });
  document.getElementById("age-list").innerHTML=html;
})();

function startTest(band){
  curBand=band;order=[];
  for(let d=0;d<7;d++){
    const idxs=[];
    ALL.forEach((it,i)=>{if(it.b===band&&it.d===d)idxs.push(i);});
    order.push(...idxs);
  }
  pos=0;answers=[];curDomain=-1;
  nextDomainIntro();
}
function nextDomainIntro(){
  const d=ALL[order[pos]].d;curDomain=d;
  document.getElementById("d-band").textContent=BANDS[curBand].label;
  const chip=document.getElementById("d-chip");chip.textContent=DOMAINS[d].name;chip.style.background=DOMAINS[d].color;
  document.getElementById("d-title").textContent=DEMOJI[d]+" "+DOMAINS[d].name;
  const cnt=order.filter(i=>ALL[i].d===d).length;
  document.getElementById("d-desc").textContent=DOMAINS[d].desc+"本轮共 "+cnt+" 题。";
  document.getElementById("d-note").textContent=BANDS[curBand].parent?"👨‍👩‍👧 请家长陪同，把题目读给孩子听，孩子点选答案。":"";
  document.getElementById("d-btn").textContent=pos>0?"休息好了，进入本轮 ▶":"进入本轮 ▶";
  show("s-domain");
}
function beginDomain(){show("s-quiz");renderItem();}

function renderItem(){
  clearMemTimers();locked=false;
  const it=ALL[order[pos]];
  document.getElementById("q-count").textContent="第 "+(pos+1)+" / "+order.length+" 题";
  document.getElementById("q-prog").style.width=((pos)/order.length*100)+"%";
  const body=document.getElementById("q-body");
  if(it.t==="mem"){playMem(it,body);}else{showOptions(it,body);}
}
function clearMemTimers(){memTimers.forEach(t=>clearTimeout(t));memTimers=[];}

function playMem(it,body){
  body.innerHTML='<div class="memhint">👀 看仔细，记住它们！</div><div class="memshow" id="memshow"></div>';
  const el=document.getElementById("memshow");let i=0;
  function step(){
    if(i<it.seq.length){el.textContent=it.seq[i];i++;memTimers.push(setTimeout(step,900));}
    else{el.textContent="";showOptions(it,body);}
  }
  step();
}
function showOptions(it,body){
  let html="";
  if(it.target){html+='<div class="targetbox"><div class="t">'+it.target+'</div></div>';}
  html+='<div class="q">'+it.q+'</div>';
  if(it.t==="speed"){html+='<div class="qsmall">⏱ 尽量又快又准</div>';}
  if(it.grid){html+='<div class="optgrid">';it.opts.forEach((o,i)=>{html+='<button class="opt" onclick="answer('+i+')">'+o+'</button>';});html+='</div>';}
  else{it.opts.forEach((o,i)=>{html+='<button class="opt" onclick="answer('+i+')">'+o+'</button>';});}
  body.innerHTML=html;
  if(it.t==="speed"){t0=Date.now();}
}
function answer(i){
  if(locked)return;locked=true;
  const it=ALL[order[pos]];
  const rec={d:it.d,ok:(i===it.a)};
  if(it.t==="speed"){rec.ms=Date.now()-t0;}
  answers.push(rec);
  const fb=document.getElementById("fb");
  fb.textContent=rec.ok?"✅":"💪";fb.style.display="block";
  setTimeout(()=>{fb.style.display="none";
    pos++;
    if(pos>=order.length){finish();}
    else if(ALL[order[pos]].d!==curDomain){nextDomainIntro();}
    else{renderItem();}
  },550);
}
function pauseGame(){
  clearMemTimers();
  document.getElementById("overlay").style.display="flex";
}
function resumeGame(){
  document.getElementById("overlay").style.display="none";
  renderItem();
}
function level(p){return p>=80?"强项 💪":p>=60?"不错 🙂":p>=40?"一般 🌱":"待加强 🍀";}
function finish(){
  document.getElementById("r-band").textContent=BANDS[curBand].label;
  const stats=[0,1,2,3,4,5,6].map(d=>{
    const a=answers.filter(x=>x.d===d),ok=a.filter(x=>x.ok).length;
    const ms=a.filter(x=>x.ms).map(x=>x.ms);
    return{d,total:a.length,ok,pct:a.length?Math.round(ok/a.length*100):0,
      avgMs:ms.length?Math.round(ms.reduce((s,v)=>s+v,0)/ms.length/100)/10:0};
  });
  let html="";
  stats.forEach(s=>{
    html+='<div class="bar"><div class="blabel"><span>'+DEMOJI[s.d]+" "+DOMAINS[s.d].name+'</span><span>'+s.ok+'/'+s.total+' · '+level(s.pct)+'</span></div>'
      +'<div class="bartrack"><div class="barfill" style="width:'+s.pct+'%;background:'+DOMAINS[s.d].color+'"></div></div></div>';
    if(s.d===3&&s.avgMs){html+='<div class="qsmall" style="text-align:right">⚡ 平均用时 '+s.avgMs+' 秒/题</div>';}
  });
  document.getElementById("r-bars").innerHTML=html;
  const sorted=[...stats].sort((a,b)=>b.pct-a.pct);
  const weak=[...stats].sort((a,b)=>a.pct-b.pct)[0];
  const tips={0:"多阅读、多表达，语言能力在使用中生长。",1:"玩魔方、折纸、走迷宫，空间感越练越强。",2:"数独、图形推理题都是好练习。",3:"试试“复述游戏”：听完一句话，原样说出来，逐步加长。",4:"“找不同”“连连看”类小游戏，速度会慢慢提上来。",5:"玩“大家来找茬”，一次只盯一个目标，练专注。",6:"玩“红灯绿灯停”游戏，练习先想后做、管住冲动。"};
  document.getElementById("r-summary").innerHTML=
    "🌟 相对最拿手的是「"+DOMAINS[sorted[0].d].name+"」。<br>"+
    "🌱 「"+DOMAINS[weak.d].name+"」还有进步空间："+tips[weak.d]+"<br>"+
    "记住哦，这只是原创小题的一次记录，不是智力分数，开心最重要！";
  show("s-result");
}
